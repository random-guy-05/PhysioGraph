  <g id="text_43">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="40.32" y="62.784" transform="rotate(-0 40.32 62.784)">Mortality model sample: 156/900 deaths (17.3%). Stage bars include 882 stays alive and in the ICU at hour 16.</text>
  </g>
  <g id="text_44">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263542" x="40.32" y="486.72" transform="rotate(-0 40.32 486.72)">Outside the stage bars: 15 deaths by hour 16; 3 earlier ICU departures/discharges (0 in-hospital deaths).</text>
  </g>
  <g id="text_45">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263542" x="40.32" y="510.912" transform="rotate(-0 40.32 510.912)">Stage A is unavailable. B–E are minimum evidenced proxy stages; unclassified does not mean normal.</text>
  </g>
  <g id="text_46">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="40.32" y="533.952" transform="rotate(-0 40.32 533.952)">Rates are descriptive and unadjusted, conditional on being alive and in the ICU at hour 16; deaths before staging are not assigned a stage.</text>
