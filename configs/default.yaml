# ──────────────────────────────────────────────────────────────────────────────
# Causal Coupling Strengths (Counterfactual Analysis)
# ──────────────────────────────────────────────────────────────────────────────
causal_couplings:
  map:
    lactate: -0.35
    creatinine: -0.20
    ph: 0.20
  sbp:
    map: 0.35
    lactate: -0.25
  hr:
    map: -0.15
    lactate: 0.10
  lactate:
    ph: -0.45
    resp_rate: 0.25

# ──────────────────────────────────────────────────────────────────────────────
# Interpretation Parameters
# ──────────────────────────────────────────────────────────────────────────────
interpretation:
  ig_steps: 24
  ig_max_batches: 12
  counterfactual_standardized_delta: 0.5
  subgroup_min_size: 30
  bootstrap_n: 1000
  bootstrap_alpha: 0.05

