# ──────────────────────────────────────────────────────────────────────────────
# Model Hyperparameters - PhysioGraph (Primary)
# ──────────────────────────────────────────────────────────────────────────────
model:
  physiograph:
    hidden_dim: 128
    heads: 8
    dropout: 0.28
    gru_layers: 2
    bidirectional: true
  vanilla_gru:
    hidden_dim: 96
    dropout: 0.34
    gru_layers: 2
  gnn_only:
    hidden_dim: 96
    heads: 8
    dropout: 0.34

# ──────────────────────────────────────────────────────────────────────────────
# Training Parameters
# ──────────────────────────────────────────────────────────────────────────────
training:
  seed: 42
  max_epochs: 60
  early_stopping_patience: 10
  batch_size: 64
  focal_gamma: 1.5
  grad_clip_norm: 1.0
  decay_rate: 0.1
  chunksize: 5000000

  # Data splits
  test_fraction: 0.15
  validation_fraction: 0.20  # of remaining after test split

  # Optimizer - task-specific learning rates
  optimizer:
    base:
      lr: 0.0008
      weight_decay: 0.0001
    aux:
      lr: 0.0012
      weight_decay: 0.0001
    alpha:
      lr: 0.02
      weight_decay: 0.0

  # LR Scheduler
  scheduler:
    mode: max
    factor: 0.5
    patience: 5
    min_lr: 0.000001

  # Auxiliary task weights
  aux_task_weights: [0.35, 0.35, 0.20]

# ──────────────────────────────────────────────────────────────────────────────
# Comparator Model Specs (External Pipeline)
# ──────────────────────────────────────────────────────────────────────────────
default_validation_fraction: 0.25
default_regularization_grid: [0.0, 0.01, 0.1, 1.0]

comparator_specs:
  lactate_only:
    description: "Baseline landmark lactate only."
    numeric_features:
      - baseline_lactate
    categorical_features: []

  lactate_hemodynamics:
    description: "Baseline lactate with hemodynamic context."
    numeric_features:
      - baseline_lactate
      - baseline_hr
      - baseline_sbp
      - baseline_map
      - tachycardia_flag
      - hypotension_flag
      - severe_hypotension_flag
      - hr_above_100_fraction
      - sbp_below_90_fraction
      - map_below_65_fraction
      - lactate_map_ratio
      - lactate_sbp_ratio
      - lactate_hypotension_interaction
      - lactate_tachycardia_interaction
    categorical_features: []

  lactate_end_organ:
    description: "Baseline lactate with acidemia and end-organ injury markers."
    numeric_features:
      - baseline_lactate
      - baseline_ph
      - baseline_creatinine
      - baseline_bilirubin_total
      - acidemia_flag
      - severe_acidemia_flag
      - renal_hypoperfusion_flag
      - hepatic_hypoperfusion_flag
      - perfusion_burden_score
      - lactate_acidemia_interaction
    categorical_features: []

  scai_stage_model:
    description: "SCAI-like stage comparator using harmonized stage categories."
    numeric_features:
      - baseline_lactate
    categorical_features:
      - scai_stage

