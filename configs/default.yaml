# PhysioGraph Default Configuration
# All shared constants extracted from PhysioGraph_HF_Shock.ipynb and PhysioGraph_External_Pipeline.ipynb
# Dataset-specific overrides go in mimic.yaml and eicu.yaml

# ──────────────────────────────────────────────────────────────────────────────
# Time Windows
# ──────────────────────────────────────────────────────────────────────────────
observation_hours: 4.0
outcome_hours: 24.0
outcome_window_end_hours: 28.0  # observation_hours + outcome_hours
time_step_hours: 0.25
time_step_minutes: 15  # int(time_step_hours * 60)
landmark_minutes: 240  # int(observation_hours * 60)
outcome_window_end_minutes: 1680  # int(outcome_window_end_hours * 60)
num_steps: 16  # int(observation_hours / time_step_hours)

# ──────────────────────────────────────────────────────────────────────────────
# Lactate Binning
# ──────────────────────────────────────────────────────────────────────────────
lactate_bin_edges: [-.inf, 2.0, 3.1, 5.0, .inf]
lactate_bin_labels: ["<2", "2-3.1", "3.1-5", ">=5"]
focus_lactate_bin_edges: [-.inf, 2.0, 3.0, 5.0, .inf]
focus_lactate_bin_labels: ["<2", "2-3", "3-5", ">=5"]

# ──────────────────────────────────────────────────────────────────────────────
# Heart Rate Banding
# ──────────────────────────────────────────────────────────────────────────────
hr_fine_band_edges: [-.inf, 100.0, 110.0, 120.0, 140.0, .inf]
hr_fine_band_labels: ["<100", "100-109", "110-119", "120-139", ">=140"]

# ──────────────────────────────────────────────────────────────────────────────
# SCAI Staging
# ──────────────────────────────────────────────────────────────────────────────
scai_stage_labels: ["A", "B", "C", "D", "E"]

