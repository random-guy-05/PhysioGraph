[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physiograph"
version = "0.1.0"
description = "Graph-based physiological time-series analysis for clinical prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PhysioGraph Team"},
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pandera>=0.17",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.scripts]
physiograph = "physiograph.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "nbclient>=0.10",
    "nbformat>=5.10",
]
torch = [
    "torch>=2.0",
    "torch_geometric>=2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "mimic: marks tests requiring MIMIC-IV data",
    "eicu: marks tests requiring eICU data",
]
addopts = "-v --tb=short"
